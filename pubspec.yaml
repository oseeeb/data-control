name: flux
description: "Voir sa consommation de données en direct, canal par canal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/flux_icon.png

  # Polices embarquées : l'app ne télécharge rien au lancement.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf

# Icône de l'app : `dart run flutter_launcher_icons` régénère toutes les tailles.
# Source retouchée depuis docs/logo/ avec tool/recolor_logo.py.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/flux_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: assets/brand/flux_icon_foreground.png
  min_sdk_android: 24
