name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Compiler aussi pour iOS (runner macOS, plus coûteux)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  android:
    name: Tests + APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Vérifier qu'aucune permission Internet n'est demandée
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::L'APK demande la permission INTERNET"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flux-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: Compilation iOS (sans signature)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
